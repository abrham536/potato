version: "3.8"

services:
  # Streamlit Interactive User Dashboard
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: potato_disease_ui
    ports:
      - "8501:8501"
    environment:
      - API_URL=http://backend:8000
    restart: unless-stopped
    depends_on:
      - backend

  # FastAPI REST Inference Service
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: potato_disease_api
    command: ["uvicorn", "api.app:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8000:8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
